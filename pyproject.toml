[project]
name = "cost-aware-llm-router"
version = "0.1.0"
description = "A cost-aware LLM routing system that balances response quality and inference cost."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]